# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v ./...

    - name: Fetch upstream clay reference implementation
      # Enables the differential tests in internal/clayref, which otherwise skip.
      # Keep the commit in sync with clayref.ClayCommit.
      run: |
        git clone --quiet https://github.com/nicbarker/clay local/clay
        git -C local/clay checkout --quiet e6cc369

    # - name: govulncheck
    #   uses: golang/govulncheck-action@v1
    #   with:
    #     go-version-input: 1.21
    #     go-package: ./...

    - name: Test
      run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Differential fuzz against clay
      run: go test -run XXX -fuzz FuzzClayRef -fuzztime 30s ./internal/clayref/

    - name: Codecov upload coverage
      shell: bash
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        RUN_ID: ${{ github.run_id }}
      run: |
        # Replace `linux` below with the appropriate OS
        # Options are `alpine`, `linux`, `macos`, `windows`
        # You will need to setup the environment variables below in github
        # and the project in codecov.io: https://app.codecov.io/gh/${{ github.repository }}
        go test -v -coverprofile=coverage.txt -covermode=atomic ./...
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov --verbose upload-process --fail-on-error -t $CODECOV_TOKEN -n 'service'-$RUN_ID -F service -f coverage.txt
